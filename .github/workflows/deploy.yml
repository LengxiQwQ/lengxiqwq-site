name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "*.md"
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Content repo ref or commit SHA (default: main)"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CONTENT_REPOSITORY: LengxiQwQ/lengxiqwq-site-content
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI: true
      CONTENT_DIR: .content-src
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
      PUBLIC_MICROSOFT_CLARITY_ID: ${{ vars.PUBLIC_MICROSOFT_CLARITY_ID }}

    steps:
      - name: Resolve content ref
        id: target
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        if: env.CONTENT_REPOSITORY != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        run: |
          set -euo pipefail
          if [ -d "${{ env.CONTENT_WORKING_COPY }}/.git" ]; then
            echo "Content commit: $(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)"
          else
            echo "No private content repository checked out."
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize content
        run: pnpm content:sync

      - name: Run Astro check
        run: pnpm check

      - name: Run TypeScript type-check
        run: pnpm type-check

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4