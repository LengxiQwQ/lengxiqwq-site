name: 同步 Memos 动态到内容仓

on:
  schedule:
    # 每 1 小时自动检查并同步一次 (UTC 时间每小时的 15 分，避开整点拥堵)
    - cron: "15 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [memos-updated, sync-memos]

concurrency:
  group: sync-memos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-memos:
    name: 同步 Memos 动态
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出主仓库
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检出私有内容仓
        uses: actions/checkout@v4
        with:
          repository: LengxiQwQ/lengxiqwq-site-content
          path: .content-repo
          token: ${{ secrets.CONTENT_REPO_TOKEN }}

      - name: 执行 Memos 同步与图片优化
        env:
          MEMOS_API_URL: ${{ vars.MEMOS_API_URL || 'https://funpyfry.sealoshzh.site' }}
          MEMOS_PARENT: ${{ vars.MEMOS_PARENT || 'users/1' }}
        run: |
          npx tsx scripts/sync-memos.ts --content-dir .content-repo

      - name: 提交并推送内容仓变更
        run: |
          cd .content-repo
          if [ -n "$(git status --porcelain content/dynamic public/assets/images/dynamic)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/dynamic public/assets/images/dynamic
            git commit -m "chore: 同步 Memos 云端动态与图片"
            git push origin main
            echo "✅ 已成功将最新的 Memos 动态与优化图片同步并推送到内容仓。"
          else
            echo "ℹ️ 未检测到 Memos 有新增或修改，无需提交。"
          fi
