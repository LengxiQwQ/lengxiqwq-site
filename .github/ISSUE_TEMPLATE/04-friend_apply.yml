name: 友链申请
description: 申请添加友情链接（支持自动反链审核与跨仓库自动添加）
title: "[友链申请]: "
labels: ["friend-apply"]
body:
  - type: markdown
    attributes:
      value: |
        提交申请前，请先将本站添加至您的友链中：
        - **站点名称**：冷汐的杂货铺
        - **站点描述**：你好谢谢小笼包再见
        - **站点链接**：https://lengxiqwq.com
        - **头像链接**：https://lengxiqwq.com/avatar.jpg
        - **RSS 订阅（可选）**：https://lengxiqwq.com/rss.xml
        - **网页截图（可选）**：https://lengxiqwq.com/screenshot.jpg

        提交后系统将自动检测反向链接，审核通过后将自动录入并上线。
  - type: input
    id: title
    attributes:
      label: 站点名称
      description: 您的博客或网站名称
      placeholder: 例如：我的个人博客
    validations:
      required: true
  - type: input
    id: desc
    attributes:
      label: 站点描述
      description: 一句话介绍您的站点
      placeholder: 这是一个记录技术与生活的个人小站
    validations:
      required: true
  - type: input
    id: siteurl
    attributes:
      label: 站点链接
      description: 您的网站主页链接（需包含 http:// 或 https://）
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: imgurl
    attributes:
      label: 头像链接
      description: 您的站点头像图片地址（需支持外链访问）
      placeholder: https://example.com/avatar.png
    validations:
      required: true
  - type: input
    id: feedurl
    attributes:
      label: RSS 订阅链接（可选）
      description: RSS/Atom 订阅地址（选填，用于展示最新文章，留空将尝试自动探测）
      placeholder: https://example.com/rss.xml
    validations:
      required: false
  - type: input
    id: screenshot
    attributes:
      label: 站点截图（可选）
      description: 您的站点主页或代表性页面截图地址（需支持外链访问，选填）
      placeholder: https://example.com/screenshot.jpg
    validations:
      required: false
  - type: input
    id: checkurl
    attributes:
      label: 友链所在页面
      description: 包含本站友链的页面完整地址（必填，用于自动检测是否已添加本站）
      placeholder: https://example.com/friends
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 联系邮箱
      description: 常用联系邮箱（必填，仅用于失联通知，提交后会自动在公开 Issue 中脱敏隐藏）
      placeholder: example@example.com
    validations:
      required: true
