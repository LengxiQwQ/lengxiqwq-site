name: Feature Request
description: 提交网站功能改进或新功能建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为个人网站提出功能建议或改进想法！
  - type: textarea
    id: related-problem
    attributes:
      label: 相关的背景或问题
      description: 这个建议是为了解决什么问题，或者改善哪方面的体验？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方案
      description: 请清晰描述你希望的功能或实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有考虑过其他替代方案或临时解决方式？
  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明与参考
      description: 可在此添加参考链接、草图设计或截图。
