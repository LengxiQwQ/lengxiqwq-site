name: 新建相册
description: 手机端/网页端一键快速创建新相册（图集）
title: "【相册】"
labels: ["album"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📷 创建新相册
        填写相册信息，并一次性上传多张照片。系统将自动批量压缩转码为 WebP，并注册到博客相册中。
        *注意：仅仓库管理员提交有效。创建后系统将自动生成相册并发布上线，随后关闭此 Issue。*
  - type: input
    id: album_name
    attributes:
      label: 相册名称
      placeholder: 例如：马来西亚 · 仙本那潜水记录
    validations:
      required: true
  - type: input
    id: album_id
    attributes:
      label: 相册英文 ID / 文件夹名（选填）
      description: 存放照片的文件夹标识（如 semporna-2026），若留空将自动根据名称转为拼音
      placeholder: 例如：semporna-2026
    validations:
      required: false
  - type: textarea
    id: album_desc
    attributes:
      label: 相册描述
      placeholder: 记录相册背后的故事...
    validations:
      required: true
  - type: input
    id: album_date
    attributes:
      label: 拍摄日期（选填，留空默认今天）
      placeholder: 例如：2026-10-20
    validations:
      required: false
  - type: input
    id: album_location
    attributes:
      label: 拍摄地点（选填）
      placeholder: 例如：马来西亚 · 仙本那
    validations:
      required: false
  - type: input
    id: album_tags
    attributes:
      label: 相册标签（选填，逗号分隔）
      placeholder: 例如：旅行, 潜水, 海岛, 摄影
    validations:
      required: false
  - type: textarea
    id: album_photos
    attributes:
      label: 相册照片
      description: 请在此处点击上传图片按钮，一次性上传该相册的所有照片（第一张将默认作为相册封面）
      placeholder: 点击下方工具栏的图片图标，从手机相册选择照片批量上传...
    validations:
      required: true
