name = "your-chat-worker"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

[vars]
WALINE_SERVER_URL = "https://example.com"
SITE_URL = "https://example.com"
ALLOWED_ORIGINS = "https://example.com,http://localhost:4321"
DEFAULT_ROOMS = "chat,interconnect"
MATRIX_ENABLED = "false"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[services]]
binding = "WALINE"
service = "your-waline-worker"
